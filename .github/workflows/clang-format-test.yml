name: clang-format-test

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: DoozyX/clang-format-lint-action@v0.20
      with:
        source: '.'
        exclude: './extern ./libs'
        extensions: 'h,cpp,c'
        clangFormatVersion: 20
